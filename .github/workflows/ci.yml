name: FastAPI Calculator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest test_operations.py -v --tb=short

    - name: Run integration tests
      run: |
        pytest test_main.py -v --tb=short

    - name: Generate test report
      if: always()
      run: |
        pytest test_operations.py test_main.py --tb=short -v --junit-xml=test-results-unit-integration.xml || true

    - name: Upload unit and integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-unit-integration
        path: test-results-unit-integration.xml

  e2e:
    runs-on: ubuntu-latest
    name: End-to-End Tests
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        playwright install --with-deps

    - name: Start FastAPI server
      run: |
        python main.py &
        sleep 5

    - name: Run E2E tests
      run: |
        pytest test_e2e.py -v --tb=short

    - name: Generate E2E test report
      if: always()
      run: |
        pytest test_e2e.py --tb=short -v --junit-xml=test-results-e2e.xml || true

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-e2e
        path: test-results-e2e.xml

  coverage:
    runs-on: ubuntu-latest
    name: Test Coverage Report
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Generate coverage report
      run: |
        pytest test_operations.py test_main.py --cov=. --cov-report=xml --cov-report=html --tb=short

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  build:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t fastapi-calculator:latest .
        echo "Docker image built successfully"

    - name: Test Docker build
      run: |
        docker build -t fastapi-calculator:test .

  summary:
    runs-on: ubuntu-latest
    name: Test Summary
    if: always()
    needs: [test, e2e, coverage, build]

    steps:
    - name: Report summary
      run: |
        echo "=== FastAPI Calculator CI/CD Summary ==="
        echo "✓ Unit & Integration Tests: Complete"
        echo "✓ End-to-End Tests: Complete"
        echo "✓ Coverage Report: Complete"
        echo "✓ Docker Build: Complete"
        echo ""
        echo "All checks passed! Ready for deployment."
